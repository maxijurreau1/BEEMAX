name: Deploy BEEMAX and Marketplace Workers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy both Workers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BEEMAX
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy BEEMAX Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Marketplace Worker
        run: npm run deploy:marketplace:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
