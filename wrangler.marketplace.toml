name = "market-place"
main = "apps/worker/src/marketplace-worker.ts"
compatibility_date = "2026-04-01"
account_id = "bba28add4f99bd9aae158f173168145d"
# No custom-domain route is configured: the API is served on workers.dev and
# the Pages build calls it via VITE_API_BASE.

[vars]
MARKETPLACE_ORIGIN = "https://max-games-hif.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "beemax-production-db"
database_id = "5a8e3def-a8ef-4fda-907f-20bc5f24a501"
migrations_dir = "apps/worker/d1/migrations"
# Provision DOWNLOADS_SECRET as a Wrangler secret (minimum 32 random bytes),
# not as a plaintext [vars] entry. The audited HMAC route is enabled when set.
# Keep DOWNLOADS as a trusted service binding that issues provider-native URLs.
# No public endpoint accepts payment or execution success from a browser.

[triggers]
crons = ["*/5 * * * *"]
