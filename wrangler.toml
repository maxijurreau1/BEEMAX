name = "beemax"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-10-26"
account_id = "0b81b8c4e766ceb27fc7ed55c06d857e"

[vars]
ENV = "production"
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://portal-os1.pages.dev,https://portal-os1-969.pages.dev,https://max-games.pages.dev"
ICVS_ENABLED = "true"
MAX_PROCESS_HEAP_BYTES = 2097152 # 2MB Hard Cap

[assets]
directory = "./apps/pages/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "planetary-max-db"
database_id = "42213e2a-9607-4b46-9744-07d1420e0a60"
migrations_dir = "apps/worker/d1/migrations"

[durable_objects]
bindings = [
  { name = "MICROKERNEL_ACTOR", class_name = "MicrokernelProcessActor" },
  { name = "FACTORY_ACTOR", class_name = "ProductFactoryActor" },
  { name = "INSTANT_SPACE", class_name = "InstantSpaceDurableObject" }
]

[exports.MicrokernelProcessActor]
type = "durable-object"
storage = "sqlite"

[exports.ProductFactoryActor]
type = "durable-object"
storage = "sqlite"

[exports.InstantSpaceDurableObject]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["* * * * *"]
