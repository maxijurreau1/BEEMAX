#:schema node_modules/wrangler/config-schema.json
name = "beemax-portal-os1"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
PROTOCOL_VERSION = "DAT-JURREAUISM-v1"
PRE_TIER_INDEX = "IDX-PRETIER-001"

# Durable Object bindings exported by apps/worker/src/index.ts
[[durable_objects.bindings]]
name = "FACTORY_ACTOR"
class_name = "ProductFactoryActor"

[[durable_objects.bindings]]
name = "INSTANT_SPACE"
class_name = "InstantSpaceDurableObject"

[[durable_objects.bindings]]
name = "MICROKERNEL_ACTOR"
class_name = "MicrokernelProcessActor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProductFactoryActor", "InstantSpaceDurableObject", "MicrokernelProcessActor"]

# Cloudflare D1 database and versioned Worker migrations
[[d1_databases]]
binding = "DB"
database_name = "beemax-production-db"
database_id = "5a8e3def-a8ef-4fda-907f-20bc5f24a501"
migrations_dir = "apps/worker/d1/migrations"
